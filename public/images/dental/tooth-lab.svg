<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title desc">
  <title id="title">Cute Dental Lab Tooth</title>
  <desc id="desc">Animated tooth with sparkles and a soft blue background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf7ff"/>
      <stop offset="100%" stop-color="#d7f4ef"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="28" fill="url(#bg)"/>
  <circle cx="82" cy="62" r="24" fill="#bfeee3" opacity="0.8">
    <animate attributeName="r" values="22;26;22" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="330" cy="70" r="18" fill="#cfe7ff" opacity="0.9">
    <animate attributeName="cy" values="70;64;70" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(145 72)">
    <path d="M58 6c22 0 41 18 41 41 0 14-7 28-12 43-5 14-7 50-29 50S34 104 29 90c-5-15-12-29-12-43C17 24 36 6 58 6Z" fill="#fff" stroke="#0e9f95" stroke-width="5"/>
    <circle cx="45" cy="53" r="5" fill="#0f172a"/>
    <circle cx="73" cy="53" r="5" fill="#0f172a"/>
    <path d="M45 76c7 8 21 8 28 0" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.4s" repeatCount="indefinite"/>
    </g>
  </g>
  <g fill="#14b8a6">
    <path d="M300 182l6 12 12 6-12 6-6 12-6-12-12-6 12-6z">
      <animateTransform attributeName="transform" type="rotate" values="0 300 200;360 300 200" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
