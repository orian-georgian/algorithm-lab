  <g transform="translate(128 58)">
    <path d="M72 10c26 0 50 21 50 49 0 15-9 33-14 48-4 11-8 54-36 54s-32-43-36-54c-5-15-14-33-14-48 0-28 24-49 50-49Z" fill="#ffffff" stroke="#0f766e" stroke-width="5"/>
    <circle cx="56" cy="65" r="6" fill="#0f172a"/>
