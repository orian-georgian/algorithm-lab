<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title desc">
  <title id="title">Cute Implant Smile</title>
  <desc id="desc">Animated dental implant icon with smiling face.</desc>
  <rect width="400" height="300" rx="28" fill="#ebf8ff"/>
  <rect x="168" y="98" width="64" height="26" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="4"/>
