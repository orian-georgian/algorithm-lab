  </rect>
  <g transform="translate(120 168)">
    <rect x="0" y="0" width="160" height="68" rx="30" fill="#ffffff" stroke="#0891b2" stroke-width="4"/>
    <circle cx="54" cy="26" r="5" fill="#0f172a"/>
    <circle cx="104" cy="26" r="5" fill="#0f172a"/>
    <path d="M54 42c10 10 40 10 50 0" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  </g>
  <circle cx="74" cy="66" r="16" fill="#a7f3d0" opacity="0.75"/>
  <circle cx="332" cy="58" r="20" fill="#bae6fd" opacity="0.75"/>
</svg>
